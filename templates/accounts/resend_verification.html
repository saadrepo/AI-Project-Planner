{% extends 'base.html' %}

{% block title %}Resend verification{% endblock %}

{% block content %}
<div class="min-h-screen flex items-center justify-center bg-slate-100 px-4 py-10">
  <div class="w-full max-w-md rounded-2xl bg-white p-8 shadow-lg ring-1 ring-slate-200">
    <h1 class="text-2xl font-bold text-slate-900">Verify your email</h1>
    <p class="mt-2 text-sm text-slate-600">Request a fresh verification email for your account.</p>

    <form method="post" class="mt-6">
      {% csrf_token %}
      <button type="submit" class="w-full rounded-lg bg-slate-900 px-4 py-2.5 text-sm font-semibold text-white hover:bg-slate-800">Send verification email</button>
    </form>
  </div>
</div>
{% endblock %}
