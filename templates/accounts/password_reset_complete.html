{% extends 'base.html' %}

{% block title %}Password updated{% endblock %}

{% block content %}
<div class="min-h-screen flex items-center justify-center bg-slate-100 px-4 py-10">
  <div class="w-full max-w-lg rounded-2xl bg-white p-8 shadow-lg ring-1 ring-slate-200 text-center">
    <h1 class="text-2xl font-bold text-slate-900">Password updated</h1>
    <p class="mt-3 text-sm text-slate-600">Your password has been changed successfully.</p>
    <a href="{% url 'login' %}" class="mt-6 inline-block rounded-lg bg-slate-900 px-4 py-2 text-sm font-semibold text-white hover:bg-slate-800">Continue to login</a>
  </div>
</div>
{% endblock %}
