{% extends 'base.html' %}

{% block title %}Password reset sent{% endblock %}

{% block content %}
<div class="min-h-screen flex items-center justify-center bg-slate-100 px-4 py-10">
  <div class="w-full max-w-lg rounded-2xl bg-white p-8 shadow-lg ring-1 ring-slate-200 text-center">
    <h1 class="text-2xl font-bold text-slate-900">Check your email</h1>
    <p class="mt-3 text-sm text-slate-600">If an account exists for that email, we have sent password reset instructions.</p>
    <a href="{% url 'login' %}" class="mt-6 inline-block rounded-lg border border-slate-300 px-4 py-2 text-sm font-semibold text-slate-700 hover:bg-slate-50">Back to login</a>
  </div>
</div>
{% endblock %}
