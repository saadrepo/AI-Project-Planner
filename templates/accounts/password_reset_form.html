{% extends 'base.html' %}

{% block title %}Reset password{% endblock %}

{% block content %}
<div class="min-h-screen flex items-center justify-center bg-slate-100 px-4 py-10">
  <div class="w-full max-w-md rounded-2xl bg-white p-8 shadow-lg ring-1 ring-slate-200">
    <h1 class="text-2xl font-bold text-slate-900">Reset your password</h1>
    <p class="mt-2 text-sm text-slate-600">Enter the email address associated with your account.</p>

    <form method="post" class="mt-6 space-y-5" novalidate>
      {% csrf_token %}
      <div>
        <label for="id_email" class="mb-1 block text-sm font-medium text-slate-700">Email</label>
        {{ form.email }}
        {% if form.email.errors %}<p class="mt-1 text-xs text-red-600">{{ form.email.errors|join:', ' }}</p>{% endif %}
      </div>

      <button type="submit" class="w-full rounded-lg bg-slate-900 px-4 py-2.5 text-sm font-semibold text-white hover:bg-slate-800">Send reset link</button>
    </form>
  </div>
</div>
{% endblock %}
